# All-in-one: gateway + faster_whisper worker in one container, a drop-in
# for the upstream whisper-asr-webservice service.
#   docker compose -f deploy/docker-compose.yml up -d
# Authentication: add deploy/docker-compose.auth.yml (see deploy/auth/).
services:
  whisper:
    image: whisper-hub:faster_whisper
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        ENGINE: faster_whisper
    environment:
      - WHISPER_HUB_ENGINE_MODEL=base
      # More settings (worker/README.md), e.g.:
      # - WHISPER_HUB_ENGINE_QUANTIZATION=int8
      # - WHISPER_HUB_LOG_LEVEL=debug
    ports:
      - "9000:9000"   # legacy + OpenAI API, /healthz
      - "10300:10300" # Wyoming (Home Assistant)
    volumes:
      # Same path as upstream, so an existing model cache volume is reused.
      - cache-whisper:/root/.cache
      # Usage totals (/data/usage.json), kept across container replacements.
      - usage-data:/data
    # Longer than http.shutdown_grace (30s), so running jobs can finish.
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  cache-whisper:
  usage-data:
