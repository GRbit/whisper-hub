# whisper-hub configuration example.
#
# Every key is optional: an empty file (or none at all) gives HTTP on :9000,
# Wyoming on :10300, one engine worker at http://127.0.0.1:9100 and no
# authentication. Values shown here are the defaults unless marked otherwise.
#
# Each setting can also be set by environment variable: WHISPER_HUB_ plus the
# YAML path in upper case joined by "_", e.g. hub.queue_length ->
# WHISPER_HUB_HUB_QUEUE_LENGTH. Lists are comma separated, maps are
# key=value pairs, hub.workers takes YAML flow syntax.
# Precedence: defaults < this file < environment < command line flags.
# Within the environment, WHISPER_HUB_* variables win over the names a
# whisper-asr-webservice deployment uses (README, "Migrating").
# An unknown key in this file is an error.

http:
  # Main listener: legacy API, OpenAI API, /healthz and the usage endpoint.
  # The upstream --host/--port flags override it.
  listen: ":9000"
  # Optional second listener serving the same routes WITHOUT authentication:
  # admin access for clients the network already restricts. Off when "".
  open_listen: ""
  # Running requests may finish for this long after SIGTERM. Give docker a
  # longer stop_grace_period than this, or it kills the process first.
  shutdown_grace: 30s

log:
  # debug, info, warn, error. WHISPER_HUB_LOG_LEVEL also sets the level of
  # the engine worker, which does not read this file.
  level: info
  format: text # text or json

audio:
  ffmpeg_path: ffmpeg
  # Uploads are spooled here for ffmpeg (seekable input is needed for M4A
  # with a trailing index). Default: the system temp directory. Point it at
  # real disk when /tmp is a small tmpfs.
  spool_dir: ""
  # Keep every upload that fails to decode, with ffmpeg output, for replay.
  # Stores raw user audio: debugging only.
  failed_uploads_dir: ""

hub:
  # Engine workers. Several workers may serve the same model id; jobs are
  # spread between them.
  workers:
    - url: http://127.0.0.1:9100
      max_in_flight: 1 # jobs sent to this worker at once
  # Model used for requests without a model and for unknown names.
  # Default "": the default model of the first healthy worker.
  default_model: ""
  # Public names for model ids; an empty target means the default model.
  # whisper-1 -> default is always added unless you map it yourself.
  aliases:
    whisper-1: ""
  # Unknown model names: "default" falls back to the default model (many
  # OpenAI clients hardcode names), "error" answers model_not_found.
  unknown_model: default
  # New jobs waiting for a worker, across all workers; more get "busy".
  # Jobs that already ran (paused, or waiting to restart) do not count.
  queue_length: 100
  # Job priorities: higher runs first, equal ones in arrival order, and a
  # higher job interrupts a running lower one (see preempt_timeout). A
  # constant stream of higher jobs keeps lower ones waiting. A users file
  # entry's "priority" wins over these protocol defaults; admin, when set,
  # is the priority of access without credentials (authentication off, or
  # http.open_listen). Clients cannot choose a priority.
  priorities:
    legacy: 50
    openai: 50
    wyoming: 100
    admin: null
  # How long a running lower-priority job gets to pause for a higher one.
  # A paused job continues later where it stopped. One that does not pause
  # in time is canceled and restarts from the beginning later, unless it
  # already streamed output to its client or was restarted once: then the
  # higher job waits for it. Negative: never interrupt a running job.
  preempt_timeout: 5s
  poll_interval: 15s # re-probe of a healthy worker
  retry_min: 1s # backoff bounds while a worker is down or loading
  retry_max: 30s
  fail_threshold: 2 # failed probes before a worker leaves rotation
  connect_timeout: 5s
  # Wait for the first response line of a job; covers lazy model loading.
  # There is no overall job deadline: a long file can take an hour.
  first_byte_timeout: 10m
  probe_timeout: 30s

auth:
  # Users file. Empty turns authentication off: every request has admin
  # access, trusted because the network restricts who reaches the service,
  # as with upstream. A missing file is created as an empty template that rejects
  # everyone until it names a user. Edits are picked up automatically;
  # SIGHUP reloads at once. See README "Authentication and model access".
  users_file: ""
  poll_interval: 5s
  realm: whisper # browser login prompt on legacy paths
  # Paths that need credentials; everything else is public.
  protected_paths: ["/asr", "/detect-language", "/v1/"]
  # Take the client address from X-Forwarded-For / X-Real-IP. Only behind a
  # trusted reverse proxy.
  trust_forwarded: false
  rate_limit:
    # Failed logins per window from one client address. Further attempts
    # in that window get 401 with Retry-After. Negative disables the limit.
    failures: 10
    window: 1m
  wyoming:
    # Wyoming has no credentials: every connection acts as the user
    # "wyoming", restricted only by a users file entry of that name. Protect
    # the port by network; this list is that restriction inside the gateway.
    allow_cidrs: [] # e.g. ["192.168.1.0/24"]; empty allows every source
  # Usage accounting, see README "Usage accounting". It works with
  # authentication off too (the user is then "admin").
  usage:
    # Per-user totals across restarts. "" falls back to default_totals_file.
    totals_file: ""
    # Used while totals_file is "". The images set it to /data/usage.json
    # through WHISPER_HUB_AUTH_USAGE_DEFAULT_TOTALS_FILE; "" (the binary's
    # default) keeps totals in memory. If it cannot be written, totals stay
    # in memory with a warning. When totals_file is set but missing or
    # empty, this file is moved there at startup. Because the environment
    # beats this file, opt out in an image by setting that variable to "".
    default_totals_file: ""
    snapshot_interval: 30s # how often totals_file is rewritten when changed
    log_file: "" # one JSON line per job and per rejected login; "" disables
    log_max_bytes: 0 # rotate at this size; 0 never rotates
    log_max_backups: 5

legacy:
  # whisper-asr-webservice API: /asr, /detect-language, /docs, /openapi.json.
  max_upload_bytes: 0 # 0 = unlimited, as upstream
  raw_sample_rate: 16000 # sample rate of encode=false uploads

openai:
  max_upload_bytes: 0 # 0 = unlimited
  owned_by: whisper-hub

wyoming:
  enabled: true
  listen: ":10300"
  program_name: whisper-hub # entity name in Home Assistant
  version: "" # default: the binary version
  # Send transcript-start/chunk/stop events. Home Assistant ignores them.
  stream_transcripts: false
  max_header_bytes: 262144
  max_data_bytes: 1048576
  max_payload_bytes: 4194304
  max_utterance_bytes: 67108864
  max_utterance_duration: 5m
  idle_timeout: 5m
  write_timeout: 30s
  max_connections: 64
  shutdown_grace: 10s
  zeroconf:
    # mDNS announcement for Home Assistant discovery. Needs host networking.
    enabled: false
    name: whisper-hub
    host: "" # default: the address of the interface routing to mDNS

worker:
  # The engine worker the gateway starts and owns, as in the all-in-one
  # image (which sets these). Empty command: workers run elsewhere.
  command: [] # e.g. [python, -m, whisper_worker]
  # Engine installed next to command. WHISPER_HUB_ENGINE unset -> this
  # engine; a different one fails at startup and names the image to use.
  engine: ""
  image_tag: "whisper-hub:%s"
  stop_timeout: 10s # SIGTERM -> SIGKILL
